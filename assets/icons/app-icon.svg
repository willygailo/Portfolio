<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="willygailo App Icon">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e29" />
      <stop offset="55%" stop-color="#0d141e" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#22d3ee" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090d12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App icon tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#appBg)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#coreGlow)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle cyber grid lines -->
  <g stroke="#94a3b8" stroke-opacity="0.08" stroke-width="2">
    <line x1="128" y1="48" x2="128" y2="464" />
    <line x1="256" y1="48" x2="256" y2="464" />
    <line x1="384" y1="48" x2="384" y2="464" />
    <line x1="48" y1="128" x2="464" y2="128" />
    <line x1="48" y1="256" x2="464" y2="256" />
    <line x1="48" y1="384" x2="464" y2="384" />
  </g>

  <!-- Corner brackets -->
  <g fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-opacity="0.45">
    <path d="M76 112V76H112" />
    <path d="M400 76H436V112" />
    <path d="M76 400V436H112" />
    <path d="M400 436H436V400" />
  </g>

  <!-- Primary security shield -->
  <path
    d="M256 76L404 132V256C404 347.5 339.5 415.5 256 442C172.5 415.5 108 347.5 108 256V132L256 76Z"
    fill="#0c121b"
    stroke="url(#shieldStroke)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Inner shield hairline -->
  <path
    d="M256 98L384 146.5V254C384 332.5 328.5 392.5 256 417C183.5 392.5 128 332.5 128 254V146.5L256 98Z"
    fill="none"
    stroke="#34d399"
    stroke-opacity="0.22"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Terminal header bar inside shield -->
  <circle cx="222" cy="144" r="5.5" fill="#10b981" />
  <circle cx="242" cy="144" r="5.5" fill="#22d3ee" />
  <rect x="258" y="139.5" width="38" height="9" rx="4.5" fill="#334155" />

  <!-- Geometric "W" -->
  <path
    d="M150 198L177 316L211 232L245 316L272 198"
    fill="none"
    stroke="#f1f5f9"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Geometric "G" -->
  <path
    d="M358 222C349 205 332 196 312 196C284 196 266 218 266 257C266 296 284 318 314 318C341 318 358 300 358 273V258H314"
    fill="none"
    stroke="url(#shieldStroke)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Terminal prompt underline -->
  <path d="M196 356L216 368L196 380" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="230" y="372" width="84" height="9" rx="4.5" fill="#34d399" />
</svg>
