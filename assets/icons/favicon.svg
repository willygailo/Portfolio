<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WG Cyber Shield Monogram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Rounded dark base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer cyber shield frame -->
  <path
    d="M32 8L52 15.5V31.5C52 43.2 43.5 52.3 32 56C20.5 52.3 12 43.2 12 31.5V15.5L32 8Z"
    fill="#0d141d"
    stroke="url(#accentGrad)"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Top terminal notch -->
  <rect x="25" y="13.5" width="14" height="2.5" rx="1.25" fill="#22d3ee" opacity="0.85" />

  <!-- Geometric "W" -->
  <path
    d="M17.5 23.5L21 40.5L25.5 28.5L30 40.5L33.5 23.5"
    fill="none"
    stroke="#f1f5f9"
    stroke-width="2.9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Geometric "G" -->
  <path
    d="M46.5 27C45.3 24.8 43.1 23.5 40.5 23.5C36.9 23.5 34.5 26.6 34.5 32C34.5 37.4 36.9 40.5 40.8 40.5C44.2 40.5 46.5 38.2 46.5 34.5V32.5H40.5"
    fill="none"
    stroke="url(#accentGrad)"
    stroke-width="2.9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
